[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["headset_battery_indicator*"]

[tool.setuptools.package-data]
headset_battery_indicator = ["translations/*.qm"]

[project]
name = "headset-battery-indicator"
version = "2.3.1"
authors = [
    { name = "Ruflas", email = "ruflas@ruflas.dev" },
]
description = "A system tray icon to monitor headset battery levels, based on HeadsetControl."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]

headset-battery-indicator = "headset_battery_indicator.__main__:main"

[tool.briefcase]
project_name = "Headset Battery Indicator"
bundle = "dev.ruflas"
version = "2.3.1"
app_name = "headset_battery_indicator"

[tool.briefcase.app.headset-battery-indicator]

formal_name = "Headset Battery Indicator"
description = "A system tray icon to monitor headset battery levels"

sources = ["headset_battery_indicator", "icons"]
requires = [
    "PySide6",
]

[tool.briefcase.app.headset-battery-indicator.linux.appimage]
# The Qt xcb platform plugin needs the whole xcb/xkbcommon stack at runtime.
# Whatever is not listed here is not installed in the build image, so
# linuxdeploy cannot bundle it and the AppImage fails to start on a clean
# system (libEGL comes from libglvnd-egl, not from mesa-libGL).
system_requires = [
    "pulseaudio-libs",
    "mesa-libGL",
    "glib2",
    "libglvnd-egl",
    "fontconfig",
    "libxkbcommon",
    "libxkbcommon-x11",
    "libxcb",
    "xcb-util",
    "xcb-util-wm",
    "xcb-util-image",
    "xcb-util-keysyms",
    "xcb-util-renderutil"
]
# Qt 6.5+ also requires libxcb-cursor, which AlmaLinux 8 ships only in EPEL
dockerfile_extra_content = """
RUN yum install -y epel-release && yum install -y xcb-util-cursor
"""
manylinux = "manylinux_2_28"
